version: 2

updates:
  # npm dependencies
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 10
    reviewers:
      - auto-company
    labels:
      - dependencies
      - automated
    commit-message:
      prefix: "deps"
      include: scope
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
        labels:
          - dependencies
    allow:
      - dependency-type: production
      - dependency-type: development

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 5
    reviewers:
      - auto-company
    labels:
      - dependencies
      - ci
      - automated
    commit-message:
      prefix: "ci"
      include: scope

  # Docker
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    open-pull-requests-limit: 3
    reviewers:
      - auto-company
    labels:
      - dependencies
      - docker
      - automated
    commit-message:
      prefix: "docker"
      include: scope
